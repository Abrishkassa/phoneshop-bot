<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Phone Shop</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="shopName">Phone Shop</h1>
    </header>

    <nav class="tabs" id="categoryTabs">
      <button class="tab active" data-category="phone">📱 Phones</button>
      <button class="tab" data-category="laptop">💻 Laptops</button>
      <button class="tab" data-category="earphone">🎧 Earphones</button>
      <button class="tab" data-category="accessory">🔌 Accessories</button>
    </nav>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by name or brand..." />
    </div>

    <div class="filters" id="priceFilters">
      <button class="chip active" data-range="all">All prices</button>
      <button class="chip" data-range="under10k">Under 10k</button>
      <button class="chip" data-range="10to20k">10k–20k</button>
      <button class="chip" data-range="over20k">20k+</button>
    </div>

    <div class="filters" id="brandFilters"></div>

    <main id="grid" class="grid"></main>
    <p id="emptyState" class="empty-state hidden">No products in this range yet.</p>
    <p id="loadingState" class="loading-state">Loading...</p>
  </div>

  <!-- Product detail bottom sheet -->
  <div id="sheetOverlay" class="sheet-overlay hidden">
    <div id="sheet" class="sheet">
      <div class="sheet-handle"></div>
      <div id="sheetContent"></div>
    </div>
  </div>

  <!-- Compare bar -->
  <div id="compareBar" class="compare-bar hidden">
    <span id="compareText"></span>
    <button id="compareClear">Clear</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
